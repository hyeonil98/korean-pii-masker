model:
  name: klue/roberta-base       # 베이스 모델 (klue/roberta-base 권장)
  max_length: 256               # 최대 토큰 수

data:
  train: data/processed/train.jsonl
  valid: data/processed/valid.jsonl

training:
  output_dir: models/checkpoints/v1
  num_train_epochs: 5
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 64
  learning_rate: 3.0e-5
  weight_decay: 0.01
  warmup_steps: 100
  lr_scheduler_type: cosine
  eval_strategy: epoch
  save_strategy: epoch
  load_best_model_at_end: true
  metric_for_best_model: eval_f1
  greater_is_better: true
  fp16: true                    # RTX 5070 Ti GPU 사용
  dataloader_num_workers: 0
  seed: 42
  logging_steps: 50
  report_to: none
